<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Change Avatar - METFLIX</title>

  <link rel="stylesheet" href="css/change-avatar.css">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <div class="avatar-page">

    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i>
      Back
    </a>

    <div class="avatar-box">

      <h1>Change Avatar</h1>

      <p class="subtitle">
        Choose your avatar
      </p>


      <!-- CURRENT AVATAR -->

      <div class="current-avatar">
        <img
          id="currentAvatar"
          src="avatars/avatar1.png"
          alt="Current Avatar">
      </div>


      <h2>Choose an Avatar</h2>


      <!-- 6 AVATARS -->

      <div class="avatar-grid">

        <button
          class="avatar-option"
          data-avatar="avatar1.png">

          <img
            src="avatars/avatar1.png"
            alt="Avatar 1">

        </button>


        <button
          class="avatar-option"
          data-avatar="avatar2.png">

          <img
            src="avatars/avatar2.png"
            alt="Avatar 2">

        </button>


        <button
          class="avatar-option"
          data-avatar="avatar3.png">

          <img
            src="avatars/avatar3.png"
            alt="Avatar 3">

        </button>


        <button
          class="avatar-option"
          data-avatar="avatar4.png">

          <img
            src="avatars/avatar4.png"
            alt="Avatar 4">

        </button>


        <button
          class="avatar-option"
          data-avatar="avatar5.png">

          <img
            src="avatars/avatar5.png"
            alt="Avatar 5">

        </button>


        <button
          class="avatar-option"
          data-avatar="avatar6.png">

          <img
            src="avatars/avatar6.png"
            alt="Avatar 6">

        </button>

      </div>


      <!-- STATUS -->

      <p id="status"></p>

    </div>

  </div>


  <script
    type="module"
    src="js/change-avatar.js">
  </script>

</body>

</html>
