<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Change Email - METFLIX</title>

  <link rel="stylesheet" href="css/change-email.css">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <div class="email-page">

    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i>
      Back
    </a>

    <div class="email-box">

      <h1>Change Email</h1>

      <p class="subtitle">
        Update your email address
      </p>

      <!-- CURRENT EMAIL -->

      <div class="current-email">

        <label>Current Email</label>

        <p id="currentEmail">
          Loading...
        </p>

      </div>


      <!-- NEW EMAIL -->

      <div class="input-group">

        <label for="newEmail">
          New Email
        </label>

        <input
          type="email"
          id="newEmail"
          placeholder="Enter your new email"
          autocomplete="email"
        >

      </div>


      <!-- PASSWORD -->

      <div class="input-group">

        <label for="password">
          Current Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your current password"
          autocomplete="current-password"
        >

      </div>


      <!-- SAVE BUTTON -->

      <button id="saveEmailBtn">
        <i class="fas fa-save"></i>
        Save Email
      </button>


      <!-- STATUS -->

      <p id="status"></p>

    </div>

  </div>


  <script
    type="module"
    src="js/change-email.js">
  </script>

</body>

</html>
